<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codex2 | 四会美丽乡村</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone" aria-label="四会美丽乡村首页">
      <header class="status-bar">
        <strong>12:00</strong>
        <span class="status-icons">▮▮▮ Wi-Fi ▰</span>
      </header>

      <nav class="top-bar" aria-label="页面标题">
        <h1>首页</h1>
        <button class="capsule" aria-label="更多"><span>•••</span><span>○</span></button>
      </nav>

      <section class="welcome">
        <h2>四会美丽乡村&nbsp; 欢迎您</h2>
      </section>

      <section class="hero-card" aria-label="自然风光轮播">
        <div class="landscape" aria-hidden="true">
          <span class="mountain mountain-a"></span>
          <span class="mountain mountain-b"></span>
          <span class="field field-a"></span>
          <span class="field field-b"></span>
          <span class="field field-c"></span>
          <span class="house-roof"></span>
          <span class="house-body"></span>
        </div>
        <div class="hero-copy">
          <h3>自然风光</h3>
          <p>春日农耕景象，生态美景</p>
        </div>
        <div class="dots" aria-label="第 2 张，共 3 张">
          <span></span><span class="active"></span><span></span>
        </div>
      </section>

      <section class="notice-card">
        <div class="notice-icon" aria-hidden="true">◀</div>
        <div>
          <div class="notice-head">
            <strong>村务通知</strong>
            <time datetime="2025-07-23T10:50:00">2025-07-23 10:50:00</time>
          </div>
          <p>今日下午3点召开村民代表大会，讨论新村规</p>
        </div>
      </section>

      <section class="service-grid" aria-label="服务入口">
        <button><span></span>事件上报</button>
        <button><span></span>积分制</button>
        <button><span></span>一件事专区</button>
        <button><span></span>热门服务</button>
        <button><span></span>代办服务</button>
        <button><span></span>政策查询</button>
        <button><span></span>农业农产</button>
        <button><span></span>更多</button>
      </section>

      <section class="tabs" aria-label="内容分类">
        <button class="active">美丽乡村</button>
        <button>应急通知</button>
        <button>法制宣传</button>
        <button>乡村动态</button>
      </section>

      <article class="feed-card" aria-label="乡村动态内容">
        <div class="thumb"></div>
        <div>
          <h3>石狗村开展美丽乡村示范活动</h3>
          <p>2025-07-23 10:00:00　石狗村村委会</p>
        </div>
      </article>

      <aside class="member-mask" aria-live="polite">
        <strong>成为村民，查看更多精彩内容</strong>
        <button id="joinVillage">入村</button>
      </aside>

      <button class="ai-assistant" aria-label="AI助手">
        <span class="avatar">
          <span class="hair"></span>
          <span class="face"></span>
          <span class="eye eye-left"></span>
          <span class="eye eye-right"></span>
          <span class="ear ear-left"></span>
          <span class="ear ear-right"></span>
        </span>
        <strong>AI助手</strong>
      </button>

      <nav class="bottom-nav" aria-label="底部导航">
        <button class="active">◆<span>首页</span></button>
        <button>▦<span>村务</span></button>
        <button>▦<span>服务</span></button>
        <button>▦<span>我的</span></button>
        <i></i>
      </nav>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
